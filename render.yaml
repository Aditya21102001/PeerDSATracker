# Render blueprint. Both services run on the free instance: 512 MB RAM, 0.1 CPU,
# spun down after 15 minutes of inactivity.
#
# Values marked `sync: false` are never committed -- Render prompts for them when the
# blueprint is first created, and leaves them alone on later syncs.
# Values marked `generateValue: true` are created by Render as a random base64 256-bit
# string, so they never pass through a keyboard, a chat log, or this file.

# The backend and analytics services must present the SAME X-Internal-Token. Putting it
# in a shared group means Render generates it once and both services read it.
#
# If Render rejects `generateValue` inside a group on blueprint creation, the fallback is
# to delete this group, declare `INTERNAL_TOKEN: {sync: false}` on both services, and
# paste the same value into each.
envVarGroups:
  - name: peerdsa-shared
    envVars:
      - key: INTERNAL_TOKEN
        generateValue: true

services:
  # ------------------------------------------------------- Spring Boot backend
  # Render has no native Java runtime, so this ships as a Docker image.
  # NOTE: the live services were created manually and are named `peerdsatracker` and
  # `peerdsatracker-1`. This blueprint would create new ones under these names.
  - name: peerdsa-backend
    type: web
    runtime: docker
    plan: free
    region: virginia # the Neon endpoint is us-east-1; keep them together
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVarGroups:
      - peerdsa-shared # supplies INTERNAL_TOKEN
    envVars:
      # Tuned for 512 MB / 0.1 CPU. See backend/Dockerfile for the reasoning.
      # If the container is OOM-killed (exit 137), drop MaxRAMPercentage to 40.
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=50.0 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"

      # /actuator/health otherwise includes a database indicator that blocks on the
      # 30s Hikari connection-timeout while Neon's compute is cold, and reports 503.
      # Render allows a health check only 5 seconds, so the deploy would fail.
      - key: MANAGEMENT_HEALTH_DB_ENABLED
        value: "false"

      # The older emailed-link reset flow has no mailer: /api/auth/forgot and /reset return
      # 404 while this is false. Recovery in production goes through one-time codes instead
      # (/api/auth/otp/*), which do have a working transport -- see OTP_* below.
      - key: RESET_ENABLED
        value: "false"

      - key: STREAK_ZONE
        value: Asia/Kolkata

      # ---------------------------------------------------- one-time codes by email
      # MUST be false here. Demo mode returns the code in the HTTP response, which hands a
      # working credential to whoever asks for one against any address.
      - key: OTP_DEMO_MODE
        value: "false"

      # HTTP API, not SMTP: Render blocks the outbound SMTP ports, so a JavaMailSender
      # implementation passes every local test and then silently sends nothing here.
      - key: OTP_EMAIL_PROVIDER
        value: brevo

      # Brevo API key, and a sender address verified in the Brevo console. An unverified
      # sender is rejected, delivery fails, and /api/auth/otp/request answers 503 --
      # deliberately, rather than falling back to returning the code.
      - key: OTP_EMAIL_API_KEY
        sync: false
      - key: OTP_EMAIL_FROM
        sync: false

      # ------------------------------------------------------------- Google sign-in
      # Leave both unset to ship without the feature: no /oauth2/** endpoints are
      # registered and the frontend hides the button. If set, register
      # https://<this service>.onrender.com/login/oauth2/code/google in the Google console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # A Google identity with no account here is REFUSED. Turning this on means anyone
      # who reaches the sign-in page can create an account by clicking one button.
      - key: OAUTH_AUTO_PROVISION
        value: "false"

      # Startup fails if this names a privileged role. Keep it USER.
      - key: OAUTH_DEFAULT_ROLE
        value: USER

      # --- set in the dashboard, never committed ---
      - key: NEON_POOLED_URL # app datasource, the "-pooler" host
        sync: false
      - key: NEON_UNPOOLED_URL # Flyway, the direct host (PgBouncer breaks its advisory lock)
        sync: false
      - key: NEON_USER
        sync: false
      - key: NEON_PASSWORD
        sync: false

      # Render generates this. Must be >= 32 bytes: a base64 256-bit value is 44 chars,
      # which JwtService accepts. Never reuse the local development secret.
      - key: JWT_SECRET
        generateValue: true

      # `fromService` can only yield host/port/hostport, never a URL with a scheme.
      # Paste the analytics service's public https://...onrender.com URL: the public
      # URL is also what wakes it from spin-down.
      - key: ANALYTICS_BASE_URL
        sync: false

      # Both are patched after the Vercel domain exists. Runtime env vars, so this is
      # a restart, not a rebuild.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # AI assistant. A blank key disables the feature (chat returns 503 "not configured")
      # so the rest of the app deploys fine without it. Get a free key at openrouter.ai.
      # OPENROUTER_MODEL must be a real free model id ending in ":free"; the free list
      # rotates. The default (llama-3.3-70b-instruct:free) is baked into application.yml.
      - key: OPENROUTER_API_KEY
        sync: false

  # ---------------------------------------------------------- FastAPI analytics
  # Stateless and DB-less. Guarded by the X-Internal-Token shared secret, which is
  # what makes a public URL acceptable (free instances cannot be private services).
  #
  # Docker rather than Render's native Python runtime: the same image runs locally and
  # here, and the Python version is pinned in analytics/Dockerfile instead of a
  # dashboard variable. buildCommand/startCommand/PYTHON_VERSION do not apply.
  - name: peerdsa-analytics
    type: web
    runtime: docker
    plan: free
    region: virginia
    rootDir: analytics
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVarGroups:
      - peerdsa-shared # the same INTERNAL_TOKEN the backend reads
