# NOTE FOR ANYONE EDITING THIS FILE
# There is exactly ONE top-level `spring:` key, and it must stay that way. YAML has no notion of
# merging two mappings with the same key: a second `spring:` further down does not add to this one,
# it REPLACES it wholesale -- silently dropping datasource, jpa and flyway, so the application
# starts with no database at all (or, on a stricter parser, refuses to start with a duplicate-key
# error). Add new Spring settings under the existing block. Same rule for `app:` and `logging:`.

spring:
  application:
    name: peerdsa-backend

  # Reads the repo-root .env as a properties file, so `mvn spring-boot:run` works
  # without exporting anything into the shell. Optional: real env vars still win.
  config:
    import: optional:file:../.env[.properties]

  datasource:
    # Runtime uses Neon's POOLED endpoint (host contains "-pooler").
    url: ${NEON_POOLED_URL}
    username: ${NEON_USER}
    password: ${NEON_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # Neon free-tier compute suspends when idle; don't hold connections open.
      minimum-idle: 0
      # A cold start can take several seconds to wake the compute.
      connection-timeout: 30000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Migrations MUST use the DIRECT (unpooled) endpoint. Neon's PgBouncer runs
    # in transaction mode, which breaks Flyway's session-level advisory lock.
    url: ${NEON_UNPOOLED_URL}
    user: ${NEON_USER}
    password: ${NEON_PASSWORD}
    locations: classpath:db/migration

  # NOTE: there is deliberately no spring.mail block. Nothing in this application sends over SMTP,
  # because Render blocks the outbound SMTP ports -- a JavaMailSender passes every local test and
  # then silently delivers nothing in production. All mail (sign-in codes AND the morning digest)
  # goes through BrevoMailClient over HTTP, configured under app.otp.email below.

server:
  # Overridable because 8080 is often already taken by another local service.
  port: ${SERVER_PORT:8080}
  # Render terminates TLS at its edge and forwards X-Forwarded-Proto/Host. Without this the
  # application believes it is serving plain http on its internal hostname, and the OAuth2
  # redirect_uri it builds ("{baseUrl}/login/oauth2/code/google") comes out as http://<internal>,
  # which Google rejects because it does not match the console entry. Set to `none` only if
  # something in front is NOT stripping client-supplied X-Forwarded-* headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

app:
  # Where reset links point and where the OAuth2 callback sends the browser back to. Must be where
  # the SPA is actually served: a wrong value silently sends production users to localhost, with a
  # perfectly successful sign-in behind them and nothing in the logs to say so.
  #
  # Deliberately blank when unset rather than defaulting to localhost here. FrontendUrl then
  # derives it from app.cors.allowed-origins -- which must already name the SPA's real origin for
  # the app to function -- and logs whichever source it used.
  frontend-base-url: ${APP_FRONTEND_URL:${FRONTEND_BASE_URL:}}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: PT15M
    refresh-ttl: P30D
    # Two tabs refreshing at once present the same token. Replaying a just-rotated token
    # inside this window is a race, not theft. Seconds, never minutes.
    refresh-grace: ${REFRESH_GRACE:PT30S}
    # The absolute ceiling on one session, measured from when the user actually authenticated and
    # carried across every rotation. refresh-ttl slides forward on each use, so without this a
    # session that is merely used often enough -- or a stolen token -- never expires.
    session-max: ${SESSION_MAX:P90D}
    # How long a token issued by code verification may set a password without the old one.
    # Separate from access-ttl on purpose: lengthening a session must not lengthen this.
    verified-window: ${OTP_VERIFIED_WINDOW:PT15M}
  otp:
    # Returns the code in the HTTP response instead of emailing it, so the flow works with no mail
    # provider. MUST be false in production: it hands a working credential to whoever asked.
    demo-mode: ${OTP_DEMO_MODE:true}
    ttl: PT10M
    length: 6
    # Per destination address per hour, counted whether or not that address has an account --
    # throttling only real accounts would make a 429 mean "this address is registered".
    max-per-hour: ${OTP_MAX_PER_HOUR:5}
    email:
      # `brevo` or `none`. Brevo's free tier is 300 emails/day and needs only an API key plus a
      # sender address verified in their console; an unverified sender is rejected outright.
      provider: ${OTP_EMAIL_PROVIDER:brevo}
      api-key: ${OTP_EMAIL_API_KEY:}
      from: ${OTP_EMAIL_FROM:}
      from-name: ${OTP_EMAIL_FROM_NAME:PeerDSATracker}
      base-url: ${OTP_EMAIL_BASE_URL:https://api.brevo.com/v3/smtp/email}
  oauth:
    # May a Google identity with no account here create one?
    #
    # ON, deliberately: this is a public study tracker, self-registration is already open at
    # /api/auth/signup, and refusing a first-time Google user reads as a broken button. It is a
    # real decision though, not a default worth inheriting -- it means anyone who can reach the
    # sign-in page can become a user. Set OAUTH_AUTO_PROVISION=false on any deployment where
    # accounts are meant to be handed out rather than taken.
    #
    # What it does NOT do is decide privileges: new accounts get default-role below, existing
    # accounts keep whatever role they already have, and startup fails outright if default-role
    # names a privileged one.
    auto-provision: ${OAUTH_AUTO_PROVISION:true}
    # What such an account gets. Startup FAILS if this names a privileged role -- see
    # OAuthProperties. Never make it ADMIN.
    default-role: ${OAUTH_DEFAULT_ROLE:USER}
    google:
      # Both blank means Google sign-in is not installed at all: no /oauth2/** endpoints exist
      # and the frontend hides the button. Get them from the Google Cloud console, and register
      # <backend-origin>/login/oauth2/code/google as an authorized redirect URI.
      #
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_* is accepted as a fallback because it
      # is the name every Spring Boot tutorial gives, and it is the name people reach for. It does
      # NOT work on its own here: OAuthClientConfig declares the ClientRegistrationRepository bean,
      # so Boot's own OAuth2 client auto-configuration backs off and never reads those properties.
      # Without this fallback, setting them looks completely correct and does nothing at all.
      client-id: ${GOOGLE_CLIENT_ID:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID:}}
      client-secret: ${GOOGLE_CLIENT_SECRET:${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET:}}
  reset:
    # The older emailed-link reset flow, superseded by the one-time code flow above (which does
    # have a working transport). ResetLinkDeliverer still only writes the link to the log, so an
    # enabled /forgot in production would promise an email it cannot send and leak working reset
    # links to anyone who can read the log stream. When false, /forgot and /reset return 404.
    enabled: ${RESET_ENABLED:true}
    ttl: PT30M
    # Per user, per hour. Exceeding it silently does nothing (still a 204).
    max-per-hour: 5
  streak:
    # Which calendar a "day" belongs to. Set this to the audience's zone
    # (e.g. Asia/Kolkata), or late-night solves land on the previous day.
    zone: ${STREAK_ZONE:UTC}
    reset-cron: "0 15 0 * * *"
  cors:
    # `ng serve` and Vercel's rewrite both proxy /api through the app's own origin,
    # so the browser makes no cross-origin request. Set anyway: a same-origin POST
    # still carries an Origin header, and if the proxy forwards it, Spring's
    # CorsFilter would reject the request with 403. allowCredentials(true) means a
    # `*` wildcard is illegal, so the exact domain must be named.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300,http://localhost:4200}
  analytics:
    base-url: ${ANALYTICS_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_TOKEN:dev-internal-token}
    connect-timeout: ${ANALYTICS_CONNECT_TIMEOUT:5s}
    # Render queues a request to a spun-down service rather than refusing it: the
    # TCP connect succeeds at the edge immediately, but the response is withheld
    # for 30-60s while the instance wakes. A 30s read timeout would fail every
    # first call after idle.
    read-timeout: ${ANALYTICS_READ_TIMEOUT:60s}
  sync:
    # Every 6 hours. Codeforces asks for ~1 request / 2s; LeetCode's unofficial
    # endpoint is soft rate-limited with no published budget.
    cron: "0 0 */6 * * *"
    throttle-millis: 2000
  mail:
    # The morning practice digest: one personalised email per subscriber. Sender credentials are
    # NOT here -- they are app.otp.email.*, shared with sign-in codes, so there is one mail account
    # to configure and one transport to get right.
    enabled: ${MAIL_ENABLED:false}
    # 09:00 daily.
    cron: ${MAIL_CRON:0 0 9 * * *}
    # Which clock 9am is on, and which calendar decides "today" and "this week". Follows the
    # streak zone so an email and a streak counter can never disagree about what day it is.
    zone: ${MAIL_ZONE:${STREAK_ZONE:UTC}}
    # Most messages one run may send. Brevo's free tier is 300/day and sign-in codes come out of
    # the SAME allowance -- this leaves headroom so a morning digest can never consume the quota
    # somebody needs to sign in that afternoon. Over the cap the run mails the most recently
    # active subscribers and logs exactly how many it skipped.
    daily-cap: ${MAIL_DAILY_CAP:200}
    # This backend's own public origin, for unsubscribe links. Must be reachable from a mail
    # client, and is the backend rather than the SPA so the link works even if the frontend is
    # down. Derived from the Render-provided hostname when present.
    public-base-url: ${MAIL_PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:}}
  openrouter:
    # The AI assistant. Blank key disables the feature: /api/chat then answers 503
    # "not configured" instead of calling upstream with an empty credential.
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    # Must be a real free model id (ends in ":free"). The free list rotates, hence an
    # env var. NOTE: "openrouter/free" is NOT a valid id and will 404.
    model: "${OPENROUTER_MODEL:meta-llama/llama-3.3-70b-instruct:free}"
    system-prompt: "${OPENROUTER_SYSTEM_PROMPT:You are Grind Buddy, a concise coding-interview tutor inside a DSA progress tracker. Help with data structures, algorithms, complexity analysis, and debugging. Prefer hints and step-by-step reasoning over dumping full solutions unless explicitly asked. Use short paragraphs and fenced code blocks. If a question is unrelated to programming or studying, gently steer back.}"
    # Most-recent messages replayed as context. Caps the token bill on a long thread.
    max-history: ${OPENROUTER_MAX_HISTORY:20}
    connect-timeout: ${OPENROUTER_CONNECT_TIMEOUT:10s}
    # A free model can be slow; give the whole streamed reply room to finish.
    read-timeout: ${OPENROUTER_READ_TIMEOUT:120s}
    # Sent to OpenRouter for dashboard attribution; both are optional there.
    referer: ${OPENROUTER_REFERER:https://peer-dsa-tracker-iota.vercel.app}
    title: ${OPENROUTER_TITLE:PeerDSATracker}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.flywaydb: INFO
