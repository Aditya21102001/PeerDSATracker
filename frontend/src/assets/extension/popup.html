<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PeerDSA ATS Copilot</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 380px;
      min-width: 380px;
      max-width: 400px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .badge {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      font-weight: 800;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }
    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .field {
      margin-bottom: 11px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      background: #131d33;
      border: 1px solid #23314d;
      border-radius: 6px;
      color: #f1f5f9;
      padding: 8px 10px;
      font-size: 12px;
      font-family: inherit;
      transition: all 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      flex: 1;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-save {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .btn-save:hover {
      background: #4338ca;
      transform: translateY(-1px);
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #10b981;
      font-weight: 600;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge">⚡</div>
    <div>
      <h2>PeerDSA ATS Copilot</h2>
      <div class="subtitle">Real-time 1-Click Form Autofill</div>
    </div>
  </div>

  <div class="field">
    <label for="fullName">Full Name</label>
    <input type="text" id="fullName" placeholder="Aditya Yadav">
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="adityakumaryadav21102001@gmail.com">
  </div>

  <div class="field">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" placeholder="+91 9217665318">
  </div>

  <div class="field">
    <label for="linkedIn">LinkedIn URL</label>
    <input type="text" id="linkedIn" placeholder="https://linkedin.com/in/aditya-yadav-9b4a48192">
  </div>

  <div class="field">
    <label for="github">GitHub URL</label>
    <input type="text" id="github" placeholder="https://github.com/Aditya21102001">
  </div>

  <div class="field">
    <label for="currentRole">Current Role & YOE</label>
    <input type="text" id="currentRole" placeholder="Software Developer (3.0 YOE)">
  </div>

  <div class="actions">
    <button class="btn-save" id="saveBtn">Save Profile</button>
  </div>
  <div class="status-msg" id="statusMsg">Saved! Active on all job pages.</div>

  <script src="popup.js"></script>
</body>
</html>
