<!--
  Bypass block (WCAG 2.4.1, Level A). Every page repeats the same nav, so a keyboard or screen
  reader user would otherwise tab through it on every single route before reaching the content
  they came for.

  It targets #main-content, which each routed page's <main> carries. Visually hidden until it
  takes focus, at which point it must be plainly visible -- a skip link nobody can see when it is
  focused is the same as no skip link at all.
-->
<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- One toggle for the whole app, so every page — including sign-in — can switch theme. -->
<app-theme-toggle class="theme-switch" />

<!--
  Says "the backend is asleep, not broken" while a cold start runs. Outside the router outlet so a
  spin-down that happens mid-session is reported on whichever page the user is already on.
-->
<app-cold-start-notice />

<router-outlet />

<!--
  Which build is running, on both halves of the deployment. After the outlet so it reads last, and
  outside it so every route gets one without repeating the markup.
-->
<app-footer />

<!-- Product tour. Renders nothing unless the tour is active; sits above every route. -->
<app-tour-overlay />

<!-- Floating study assistant, only for signed-in users. -->
@if (auth.isAuthenticated()) {
  <app-chat-widget />

  <!--
    Thumb-reachable navigation, phones only (the component hides itself above 48rem). Signed-in
    only: a signed-out visitor has nowhere to navigate to, and a bar of links that all bounce to
    /signin is noise.
  -->
  <app-mobile-nav />
}
