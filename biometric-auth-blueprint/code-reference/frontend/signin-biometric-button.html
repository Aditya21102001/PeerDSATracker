<!-- Biometric & Passkey Button on Sign-In Page -->
<!-- Includes:
     1. Dedicated Fingerprint Button with Lucide-style biometric curved ridges SVG
     2. Conditional UI hint on Username input (autocomplete="username webauthn")
     3. Loading/scanning state & user-friendly error cancellation fallback
-->

<!-- 1. Username field with Conditional UI (Discoverable Autofill) -->
<div class="field">
  <label for="identifier">Username or email</label>
  <input
    id="identifier"
    type="text"
    autocomplete="username webauthn"
    aria-describedby="identifier-passkey-hint"
    placeholder="Enter your username or email"
  />
  <span id="identifier-passkey-hint" class="field-hint">
    Touch the input to sign in with your saved fingerprint or passkey.
  </span>
</div>

<!-- 2. Biometric Sign-in Button -->
@if (passkeySupported()) {
  <button
    type="button"
    class="btn btn-ghost provider passkey-btn"
    [disabled]="busy() || passkeyBusy()"
    (click)="signInWithPasskey()"
  >
    <svg class="passkey-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
      <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
      <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
      <path d="M2 12a10 10 0 0 1 18-6"/>
      <path d="M2 16h.01"/>
      <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
      <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
      <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
      <path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
    </svg>
    <span>{{ passkeyBusy() ? 'Scanning Face ID / Fingerprint…' : 'Sign in with Face ID / Fingerprint' }}</span>
  </button>
  @if (passkeyHint()) {
    <p class="passkey-hint" role="status">{{ passkeyHint() }}</p>
  }
}
