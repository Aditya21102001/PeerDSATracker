name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The unit tests are self-contained (mocked repositories), so no database or
      # Neon credentials are needed. `verify` skips spring-boot:run entirely.
      - name: Build and test
        working-directory: backend
        run: mvn -B -ntp verify

  # These Dockerfiles are what Render builds. They cannot be tested on a machine without
  # Docker, so this job is the only thing standing between a typo and a failed deploy.
  docker:
    name: images build and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: peerdsa-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the entrypoint honours Render's PORT contract and that the app is not
      # OOM-killed under a 512 MB limit. No database is reachable, so Flyway fails and
      # the app exits -- what we assert is that the JVM started and read PORT, not that
      # the context came up.
      - name: Container starts and reads $PORT
        run: |
          docker run --rm --memory=512m --env PORT=10000 \
            --env NEON_POOLED_URL=jdbc:postgresql://127.0.0.1:1/none \
            --env NEON_UNPOOLED_URL=jdbc:postgresql://127.0.0.1:1/none \
            --env NEON_USER=none --env NEON_PASSWORD=none \
            --env JWT_SECRET=ci-secret-that-is-at-least-32-bytes-long-ok \
            peerdsa-backend:ci 2>&1 | tee /tmp/out.txt || true
          grep -q "Tomcat initialized with port 10000" /tmp/out.txt \
            || { echo "::error::container did not bind Render's \$PORT"; tail -40 /tmp/out.txt; exit 1; }
          grep -qi "OutOfMemory\|Killed" /tmp/out.txt \
            && { echo "::error::JVM ran out of memory in a 512MB container"; exit 1; } || true
          echo "OK: JVM started, bound \$PORT, no OOM under 512MB"

      - name: Build the analytics image
        uses: docker/build-push-action@v6
        with:
          context: analytics
          push: false
          load: true
          tags: peerdsa-analytics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Unlike the backend, this service needs nothing external, so it must come
      # fully up and answer its health check.
      - name: Analytics container serves /health on $PORT
        run: |
          docker run -d --name analytics --memory=512m -e PORT=10000 -p 10000:10000 peerdsa-analytics:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:10000/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          docker logs analytics
          grep -q '"status":"ok"' /tmp/health.json \
            || { echo "::error::analytics container did not serve /health"; exit 1; }

          # The guard is the only thing protecting a public URL: prove it rejects.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:10000/fetch/leetcode \
            -H 'Content-Type: application/json' -d '{"handle":"x"}')
          [ "$code" = "401" ] || { echo "::error::/fetch/leetcode answered $code, expected 401 without a token"; exit 1; }

          docker rm -f analytics
          echo "OK: analytics serves /health and rejects untokenised calls"

  frontend:
    name: frontend (Angular 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production

  analytics:
    name: analytics (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        working-directory: analytics
        run: |
          pip install -r requirements.txt
          pip install pytest

      # These cover the pure-compute services only. The LeetCode/Codeforces clients
      # are deliberately not exercised in CI: they hit live third-party APIs, and a
      # rate limit or an outage upstream must never turn this build red.
      - name: Test
        working-directory: analytics
        run: python -m pytest -q

  seed:
    name: seed script parses the A2Z sheet
    runs-on: ubuntu-latest
    # Scrapes takeuforward.org, so it can fail for reasons outside this repo.
    # Informational: it should never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the sheet still parses
        run: python tools/seed/build_striver_a2z.py --check
