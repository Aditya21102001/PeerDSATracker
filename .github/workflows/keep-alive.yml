name: Keep Render Backend Alive

on:
  schedule:
    # Run every 5 minutes (Render free tier spins down after 15 min of idle)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-render
  cancel-in-progress: true

jobs:
  ping:
    name: Ping Services to Prevent Spin-Down
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Actuator Health
        run: |
          echo "Pinging Spring Boot backend actuator health..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://peerdsatracker.onrender.com/actuator/health || true)
          echo "Backend /actuator/health response: $STATUS"

      - name: Ping Backend Meta Endpoint
        run: |
          echo "Pinging Spring Boot backend meta..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://peerdsatracker.onrender.com/api/meta || true)
          echo "Backend /api/meta response: $STATUS"

      - name: Ping Analytics Health Endpoint
        run: |
          echo "Pinging FastAPI analytics service..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://peerdsatracker-1.onrender.com/health || true)
          echo "Analytics /health response: $STATUS"

